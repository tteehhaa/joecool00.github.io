<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seoul Proxy — 새 사이트 준비 중</title>
<meta name="description" content="AI가 사람을 대신하는 시대의 법과 일을, 서울에서 기록해요. 새 사이트를 준비하고 있어요.">
<link rel="canonical" href="https://seoulproxy.com/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://seoulproxy.com/">
<meta property="og:title" content="Seoul Proxy — 새 사이트 준비 중">
<meta property="og:description" content="AI가 사람을 대신하는 시대의 법과 일을, 서울에서 기록해요.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230F0F0F'/%3E%3Cpath d='M16 7v9l6 4' stroke='%23F0F0F0' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#F0F0F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F0F" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;400;600&family=Noto+Sans+KR:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #F0F0F0;
    --ink: #0F0F0F;
    --muted: #595959;
    --tick: #B4B4B4;
    --sans: 'Inter Tight', 'Noto Sans KR', system-ui, sans-serif;
    --kr: 'Noto Sans KR', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #0F0F0F; --ink: #F0F0F0; --muted: #A3A3A3; --tick: #4A4A4A; }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }

  .page {
    min-height: 100vh;
    min-height: 100svh;
    padding: clamp(20px, 4vw, 56px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 56px;
  }

  .top, .bottom {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 12px 32px;
    font-size: 15px;
  }
  .brand { font-weight: 600; letter-spacing: 0.01em; }
  .muted { color: var(--muted); }
  .kr { font-family: var(--kr); }

  main { display: flex; flex-direction: column; gap: 28px; }
  .zone { margin: 0; display: flex; flex-wrap: wrap; gap: 12px; font-size: 14px; }
  .zone .tz { font-family: var(--sans); letter-spacing: 0.08em; }

  .clock {
    margin: 0;
    font-size: clamp(72px, 17vw, 248px);
    font-weight: 200;
    line-height: 0.88;
    letter-spacing: -0.045em;
    font-variant-numeric: tabular-nums;
  }

  .ticks {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    height: 28px;
  }
  .ticks span { display: block; width: 1px; height: 10px; background: var(--tick); }
  .ticks span.major { height: 16px; }
  .ticks span.past { background: var(--ink); }
  .ticks span.now { height: 28px; background: var(--ink); }

  h1 {
    margin: 0;
    max-width: 24em;
    font-family: var(--kr);
    font-size: clamp(22px, 2.4vw, 34px);
    font-weight: 500;
    line-height: 1.45;
    letter-spacing: -0.02em;
    word-break: keep-all;
  }

  .bottom { padding-top: 20px; border-top: 1px solid var(--ink); }
  .bottom .coord { font-variant-numeric: tabular-nums; }

  a { color: var(--ink); }
  a:hover { color: var(--muted); }
  .blog-link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    font-family: var(--kr);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 6px;
    transition: text-underline-offset .2s;
  }
  .blog-link:hover { text-underline-offset: 10px; }

  @media (prefers-reduced-motion: reduce) {
    .blog-link { transition: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <span class="brand">Seoul Proxy</span>
    <span class="muted kr">새 사이트 준비 중</span>
  </header>

  <main>
    <p class="zone muted kr"><span>지금 서울은</span><span class="tz">KST · UTC+9</span></p>
    <p class="clock"><time id="clock">--:--:--</time></p>
    <div class="ticks" id="ticks" aria-hidden="true"></div>
    <h1>AI가 사람을 대신하는 시대의 법과 일을, 서울에서 기록해요.</h1>
  </main>

  <footer class="bottom">
    <a class="blog-link" href="https://blog.naver.com/joecool00">그동안 글은 네이버 블로그에서 보기 →</a>
    <span class="muted coord">37.5665° N · 126.9780° E</span>
    <span class="muted">seoulproxy.com</span>
  </footer>
</div>

<script>
  (function () {
    var clock = document.getElementById('clock');
    var ruler = document.getElementById('ticks');
    var ticks = [];
    for (var i = 0; i < 60; i++) {
      var t = document.createElement('span');
      if (i % 5 === 0) t.className = 'major';
      ruler.appendChild(t);
      ticks.push(t);
    }

    var fmt = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Seoul', hourCycle: 'h23',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });

    function tick() {
      var now = new Date();
      var hms = fmt.format(now);
      clock.textContent = hms;
      clock.setAttribute('datetime', hms);
      var sec = now.getSeconds();
      for (var i = 0; i < 60; i++) {
        ticks[i].classList.toggle('past', i < sec);
        ticks[i].classList.toggle('now', i === sec);
      }
      setTimeout(tick, 1000 - now.getMilliseconds());
    }
    tick();
  })();
</script>
</body>
</html>
